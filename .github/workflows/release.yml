name: Release (Windows .exe)

# Tag-gated: this workflow stays DORMANT until you push a version tag
# like v1.0.0. That push is your "v1 moment". Nothing runs before then.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Never ship a release that cannot pass its own determinism test.
      - name: Run tests
        run: dotnet test bclone.sln --configuration Release

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1        # keep pinned; bump deliberately (match your local editor)
          use-dotnet: true

          # ⛔ REQUIRED, AND IT DEFAULTS TO FALSE. Without the export templates the
          # export step below fails with "No export template found at the expected
          # path: .../windows_release_x86_64.exe" — which is a failure that could
          # only ever have surfaced at the first `v*` tag, because nothing else in
          # this repo runs an export. Found by running the export locally against
          # the newly committed preset and hitting exactly that error.
          include-templates: true

      # Godot needs its export templates and a one-time import pass before
      # a headless export will succeed.
      - name: Import project
        run: godot --headless --path src/Bclone.Game --import

      - name: Export Windows build
        run: |
          mkdir dist
          godot --headless --path src/Bclone.Game --export-release "Windows Desktop" ../../dist/bclone.exe

      - name: Package
        run: Compress-Archive -Path dist\* -DestinationPath bclone-${{ github.ref_name }}-windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: bclone-${{ github.ref_name }}-windows.zip
          body_path: CHANGELOG.md   # or a script that extracts just this version's section
          draft: false
          prerelease: false

# ------------------------------------------------------------------
#  STATUS (2026-08-16, Phase 2's merge). This note used to read "the
#  view project does not exist yet and arrives with Phase 0", which
#  had been false for months.
#
#  ✅ VERIFIED as far as a machine without export templates allows:
#     `src/Bclone.Game/export_presets.cfg` is committed and Godot 4.7.1
#     accepts it — running the exact `--export-release "Windows Desktop"`
#     line above locally gets past preset lookup and parsing and stops
#     only at the missing templates. So the two things that could be
#     wrong in the preset — its NAME not matching the string above, and
#     the file being malformed — are both ruled out.
#
#  ✅ FIXED as a consequence: `include-templates: true`. It defaults to
#     false, so this workflow would have failed at the export step even
#     with a perfect preset.
